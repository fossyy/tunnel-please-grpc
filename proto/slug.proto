syntax = "proto3";

package slug;

option go_package = "./gen";

service SlugChange {
  rpc RequestChangeSlug(ChangeSlugRequest) returns (ChangeSlugResponse);
}

message ChangeSlugRequest {
  string node = 1;
  string old = 2;
  string new = 3;
}

message ChangeSlugResponse {
  bool success = 1;
  string message = 2;
}
